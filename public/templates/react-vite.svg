<svg xmlns="http://www.w3.org/2000/svg" width="400" height="260" viewBox="0 0 400 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1117"/>
      <stop offset="100%" stop-color="#141824"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="card1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#1a2540"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="260" fill="url(#bg)" rx="10"/>

  <!-- Navbar -->
  <rect x="0" y="0" width="400" height="36" fill="#1e293b" rx="10"/>
  <rect x="16" y="13" width="48" height="10" rx="3" fill="url(#accent)"/>
  <rect x="180" y="14" width="28" height="8" rx="2" fill="#334155"/>
  <rect x="216" y="14" width="28" height="8" rx="2" fill="#334155"/>
  <rect x="252" y="14" width="28" height="8" rx="2" fill="#334155"/>
  <rect x="350" y="12" width="36" height="12" rx="4" fill="url(#accent)"/>

  <!-- Hero section -->
  <rect x="80" y="52" width="240" height="12" rx="4" fill="#e2e8f0" opacity="0.9"/>
  <rect x="100" y="70" width="200" height="8" rx="3" fill="#94a3b8" opacity="0.6"/>
  <rect x="120" y="84" width="160" height="8" rx="3" fill="#94a3b8" opacity="0.4"/>
  <rect x="152" y="100" width="96" height="20" rx="5" fill="url(#accent)"/>

  <!-- Cards row -->
  <rect x="14" y="134" width="108" height="70" rx="8" fill="#1e293b"/>
  <rect x="146" y="134" width="108" height="70" rx="8" fill="#1e293b"/>
  <rect x="278" y="134" width="108" height="70" rx="8" fill="#1e293b"/>

  <!-- Card icons -->
  <rect x="24" y="143" width="20" height="20" rx="4" fill="url(#accent)" opacity="0.25"/>
  <circle cx="34" cy="153" r="5" fill="url(#accent)" opacity="0.8"/>
  <rect x="156" y="143" width="20" height="20" rx="4" fill="#8b5cf6" opacity="0.25"/>
  <circle cx="166" cy="153" r="5" fill="#8b5cf6" opacity="0.8"/>
  <rect x="288" y="143" width="20" height="20" rx="4" fill="#10b981" opacity="0.25"/>
  <circle cx="298" cy="153" r="5" fill="#10b981" opacity="0.8"/>

  <!-- Card text lines -->
  <rect x="24" y="168" width="60" height="6" rx="2" fill="#94a3b8" opacity="0.5"/>
  <rect x="24" y="180" width="80" height="8" rx="2" fill="#e2e8f0" opacity="0.8"/>

  <rect x="156" y="168" width="60" height="6" rx="2" fill="#94a3b8" opacity="0.5"/>
  <rect x="156" y="180" width="80" height="8" rx="2" fill="#e2e8f0" opacity="0.8"/>

  <rect x="288" y="168" width="60" height="6" rx="2" fill="#94a3b8" opacity="0.5"/>
  <rect x="288" y="180" width="80" height="8" rx="2" fill="#e2e8f0" opacity="0.8"/>

  <!-- Bottom bar -->
  <rect x="14" y="218" width="180" height="8" rx="3" fill="#334155" opacity="0.7"/>
  <rect x="14" y="232" width="120" height="6" rx="2" fill="#334155" opacity="0.4"/>

  <!-- React logo watermark -->
  <circle cx="370" cy="230" r="18" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.3"/>
  <ellipse cx="370" cy="230" rx="18" ry="7" fill="none" stroke="url(#accent)" stroke-width="1" opacity="0.4" transform="rotate(60 370 230)"/>
  <ellipse cx="370" cy="230" rx="18" ry="7" fill="none" stroke="url(#accent)" stroke-width="1" opacity="0.4" transform="rotate(-60 370 230)"/>
  <circle cx="370" cy="230" r="2.5" fill="url(#accent)" opacity="0.6"/>
</svg>
