<svg xmlns="http://www.w3.org/2000/svg" width="400" height="260" viewBox="0 0 400 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f3f4f6"/>
    </linearGradient>
  </defs>

  <!-- Background (light page) -->
  <rect width="400" height="260" fill="url(#bg)" rx="10"/>

  <!-- Browser nav bar simulation -->
  <rect x="0" y="0" width="400" height="32" fill="#e5e7eb" rx="10"/>
  <circle cx="16" cy="16" r="5" fill="#f87171"/>
  <circle cx="32" cy="16" r="5" fill="#fbbf24"/>
  <circle cx="48" cy="16" r="5" fill="#34d399"/>
  <!-- URL bar -->
  <rect x="80" y="8" width="240" height="16" rx="4" fill="#f9fafb" stroke="#d1d5db" stroke-width="0.5"/>
  <rect x="90" y="13" width="100" height="6" rx="2" fill="#9ca3af"/>

  <!-- Page navbar -->
  <rect x="0" y="32" width="400" height="36" fill="#ffffff" stroke="#e5e7eb" stroke-width="0.5"/>
  <rect x="16" y="44" width="40" height="12" rx="2" fill="#111827" opacity="0.9"/>
  <rect x="200" y="46" width="28" height="8" rx="2" fill="#6b7280"/>
  <rect x="234" y="46" width="28" height="8" rx="2" fill="#6b7280"/>
  <rect x="268" y="46" width="28" height="8" rx="2" fill="#6b7280"/>
  <rect x="340" y="43" width="46" height="14" rx="3" fill="#111827"/>

  <!-- Hero section -->
  <rect x="0" y="68" width="400" height="98" fill="#fafafa"/>
  <rect x="110" y="78" width="180" height="14" rx="4" fill="#111827" opacity="0.9"/>
  <rect x="118" y="98" width="164" height="10" rx="3" fill="#111827" opacity="0.6"/>
  <rect x="126" y="112" width="148" height="8" rx="2" fill="#6b7280"/>
  <!-- Buttons -->
  <rect x="125" y="128" width="70" height="20" rx="4" fill="#111827"/>
  <rect x="203" y="128" width="72" height="20" rx="4" fill="transparent" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- Divider -->
  <line x1="16" y1="176" x2="384" y2="176" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Content section - 3 cols -->
  <rect x="14" y="184" width="112" height="64" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="144" y="184" width="112" height="64" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="274" y="184" width="112" height="64" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Card content -->
  <rect x="22" y="192" width="32" height="8" rx="2" fill="#111827"/>
  <rect x="22" y="204" width="96" height="5" rx="1" fill="#9ca3af"/>
  <rect x="22" y="213" width="80" height="5" rx="1" fill="#9ca3af"/>
  <rect x="22" y="234" width="40" height="8" rx="2" fill="#3b82f6"/>

  <rect x="152" y="192" width="32" height="8" rx="2" fill="#111827"/>
  <rect x="152" y="204" width="96" height="5" rx="1" fill="#9ca3af"/>
  <rect x="152" y="213" width="80" height="5" rx="1" fill="#9ca3af"/>
  <rect x="152" y="234" width="40" height="8" rx="2" fill="#3b82f6"/>

  <rect x="282" y="192" width="32" height="8" rx="2" fill="#111827"/>
  <rect x="282" y="204" width="96" height="5" rx="1" fill="#9ca3af"/>
  <rect x="282" y="213" width="80" height="5" rx="1" fill="#9ca3af"/>
  <rect x="282" y="234" width="40" height="8" rx="2" fill="#3b82f6"/>

  <!-- HTML5 badge watermark -->
  <text x="370" y="175" font-family="monospace" font-size="18" fill="#e5534b" opacity="0.18" font-weight="bold">&#60;/&#62;</text>
</svg>
